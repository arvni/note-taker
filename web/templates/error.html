<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Something went wrong</title></head>
<body style="font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;line-height:1.5;max-width:560px;margin:0 auto;padding:24px">
  <h2 style="margin-top:0;color:#b02a2a">We couldn't complete the connection</h2>
  <p>{{.Message}}</p>
  <p style="color:#555;font-size:14px">If this keeps happening, contact
  {{if .SupportContact}}<a href="mailto:{{.SupportContact}}">{{.SupportContact}}</a>{{else}}your administrator{{end}}.</p>
</body>
</html>
