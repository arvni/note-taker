services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  server:
    build: .
    restart: unless-stopped
    command: ["/app/server"]
    env_file: [.env.prod]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # not exposed to the host; Caddy reaches it over the compose network
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["/app/worker"]
    env_file: [.env.prod]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  migrate:
    build: .
    command: ["/app/server", "migrate", "up"]
    env_file: [.env.prod]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fathom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fathom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fathom}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
