# Production stack: Caddy (auto-HTTPS) terminates TLS and reverse-proxies to the
# `server` (which serves the API and the embedded SPA frontend). Configure via
# .env.prod (copy .env.prod.example). Set POSTGRES_PASSWORD in the shell or a
# .env file used by `docker compose` for interpolation.
#
#   docker compose -f docker-compose.prod.yml run --rm migrate   # apply schema
#   docker compose -f docker-compose.prod.yml up -d               # start all

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  # Backend + embedded SPA. Not published to the host; Caddy reaches it in-network.
  server:
    build: .
    restart: unless-stopped
    command: ["/app/server"]
    env_file: [.env.prod]
    volumes:
      # Optional Google service-account key (if GOOGLE_CREDENTIALS_FILE is set).
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["/app/worker"]
    env_file: [.env.prod]
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # One-shot schema migration (run via `run --rm migrate`, also a start dependency).
  migrate:
    build: .
    command: ["/app/server", "migrate", "up"]
    env_file: [.env.prod]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fathom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fathom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fathom}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
